<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<title>ONE IMMUNE promo</title>
<link rel="stylesheet" href="fonts/hind.css">
<style>
:root{--cy:#4fd8ff;--teal:#2fe0c0;--gold:#ffc23d;--red:#ff5a6e;--green:#63e6a0;--pur:#a98bff;--ink:#eaf6ff}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#020c15}
*{box-sizing:border-box}
body{font-family:"Hind Siliguri","Inter",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.en,.lat{font-family:"Inter",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 1300px at 50% 35%,#0a3550 0%,#05192a 55%,#020a12 100%)}
#grid{position:absolute;inset:0;opacity:.18}
#parts{position:absolute;inset:0}
#parts i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(140,230,255,.9),rgba(140,230,255,0) 70%)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.scene svg.full{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.abs{position:absolute}
.ttl{position:absolute;left:70px;right:70px;top:200px;text-align:center}
.ttl .bn{font-size:64px;font-weight:700;line-height:1.15}
.ttl .en{display:inline-block;margin-top:14px;font-size:27px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);
  border:2px solid rgba(79,216,255,.45);background:rgba(79,216,255,.08);padding:8px 22px;border-radius:999px}
.lbl{position:absolute;font-size:25px;line-height:1.2;padding:8px 14px;border-radius:14px;background:rgba(4,22,36,.82);border:1.5px solid rgba(79,216,255,.5);white-space:nowrap}
.lbl b{display:block;font-family:Inter;font-size:22px;color:var(--cy);font-weight:700;letter-spacing:.02em}
.cap{position:absolute;left:80px;right:80px;text-align:center;font-size:34px;line-height:1.35;font-weight:600}
.cap .lat{color:var(--gold)}
.card{position:absolute;left:90px;right:90px;display:flex;align-items:center;gap:22px;padding:20px 26px;border-radius:26px;
  background:linear-gradient(120deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.18)}
.card .dot{flex:none;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:Inter;font-weight:800;font-size:26px;color:#03131f}
.card .t{font-size:36px;font-weight:700;line-height:1.15}
.card .t small{display:block;font-family:Inter;font-size:23px;font-weight:600;opacity:.7;letter-spacing:.02em;margin-top:3px}
#wm{position:absolute;left:56px;top:64px;display:flex;align-items:center;gap:16px;opacity:0}
#wm .lg{width:70px;height:70px;border-radius:18px;background:#fff;padding:7px}
#wm .lg img{width:100%;height:100%}
#wm .n{font-family:Inter;font-weight:800;letter-spacing:.14em;font-size:24px}
#wm .s{font-family:Inter;font-size:18px;opacity:.7;margin-top:2px}
#sub{position:absolute;left:60px;right:60px;bottom:190px;display:flex;justify-content:center}
#sub span{display:inline-block;max-width:960px;text-align:center;font-size:40px;line-height:1.4;font-weight:600;padding:16px 30px;border-radius:22px;
  background:rgba(1,10,18,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
#prog{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--cy),var(--gold))}
.pack{position:absolute;width:520px;height:760px}
.pack img{width:100%;height:100%;display:block}
.pack .sweep{position:absolute;inset:0;-webkit-mask-image:url(pack.png);-webkit-mask-size:100% 100%;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.65) 50%,transparent 58%);background-size:300% 100%}
.beam{position:absolute;top:-200px;width:520px;height:1900px;transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(150,225,255,.35),rgba(150,225,255,0) 80%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.big{font-family:Inter;font-weight:900;letter-spacing:-.01em}
.chip2{position:absolute;padding:12px 20px;border-radius:999px;font-size:27px;font-weight:700;white-space:nowrap;text-align:center;line-height:1.15}
.chip2 small{display:block;font-family:Inter;font-size:20px;font-weight:600;opacity:.75}
</style></head>
<body><div id="stage">
<div id="bg"></div>
<svg id="grid" width="1080" height="1920"><defs><pattern id="hex" width="60" height="104" patternUnits="userSpaceOnUse">
<path d="M30 0 L60 17 L60 52 L30 69 L0 52 L0 17Z M30 69 L30 104" fill="none" stroke="#3a8fb5" stroke-width="1"/></pattern>
<radialGradient id="gfade" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gm"><rect width="1080" height="1920" fill="url(#gfade)"/></mask></defs>
<rect width="1080" height="1920" fill="url(#hex)" mask="url(#gm)"/></svg>
<div id="parts"></div>
<div id="scenes"></div>
<div id="wm"><div class="lg"><img src="logo.png"></div><div><div class="n">ONENESS GLOBE</div><div class="s">Empowered by Unity</div></div></div>
<div id="sub"><span id="subt" style="opacity:0"></span></div>
<div id="prog"></div>
</div>
<script src="vo_timing.js"></script>
<script>
/* ============ helpers ============ */
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const R=(t,s,d)=>cl((t-s)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function show(el,u,s,d=.6,dy=36){if(!el)return;const k=eo(R(u,s,d));el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`}
function popin(el,u,s,d=.55){if(!el)return;const k=back(R(u,s,d));el.style.opacity=cl(R(u,s,d*.5));el.style.transform=`scale(${.5+.5*k})`}
function att(el,o){for(const k in o)el.setAttribute(k,o[k])}
function q(root,sel){return root.querySelector(sel)}
function qa(root,sel){return [...root.querySelectorAll(sel)]}
const bnNum=s=>String(s).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);

/* ============ shape library ============ */
function chicken(fill="#fbf4e8",wing="#e9dcc6",tail="#d9c6a5"){return `
<path d="M-75,0 C-150,-30 -165,-90 -140,-115 C-125,-70 -95,-40 -60,-25Z" fill="${tail}"/>
<path d="M-70,-10 C-130,-60 -140,-120 -105,-140 C-100,-100 -80,-70 -55,-45Z" fill="${wing}"/>
<path d="M-10,72 L-12,118 M20,72 L22,118" stroke="#f2a516" stroke-width="8" stroke-linecap="round"/>
<path d="M-12,118 l-18,6 M-12,118 l16,4 M22,118 l-16,6 M22,118 l18,4" stroke="#f2a516" stroke-width="6" stroke-linecap="round"/>
<path d="M-85,0 C-85,-55 -30,-75 30,-60 C70,-50 85,-20 80,15 C75,60 30,80 -15,78 C-60,75 -85,45 -85,0Z" fill="${fill}"/>
<g class="head"><path d="M35,-55 C35,-95 50,-125 80,-125 C108,-125 118,-100 112,-75 C106,-50 80,-35 60,-30Z" fill="${fill}"/>
<path d="M62,-122 C60,-140 72,-146 76,-132 C78,-150 92,-150 92,-130 C98,-144 112,-138 104,-120Z" fill="#e23a3a"/>
<path d="M110,-100 L134,-92 L110,-85Z" fill="#f2a516"/>
<path d="M104,-84 C113,-80 112,-62 102,-60 C95,-65 96,-80 104,-84Z" fill="#e23a3a"/>
<circle cx="92" cy="-102" r="5.5" fill="#1a1a1a"/></g>
<path d="M-40,-10 C-10,-35 40,-25 45,5 C30,35 -20,40 -45,20Z" fill="${wing}"/>`}
function cow(){return `
<path d="M-168,-55 C-190,-20 -192,30 -182,60" stroke="#e8e1d6" stroke-width="9" fill="none" stroke-linecap="round"/>
<ellipse cx="-182" cy="68" rx="9" ry="16" fill="#3a2a22"/>
<g fill="#e8e1d6"><rect x="-140" y="20" width="30" height="160" rx="12"/><rect x="-95" y="20" width="30" height="155" rx="12"/>
<rect x="80" y="20" width="30" height="160" rx="12"/><rect x="118" y="20" width="30" height="155" rx="12"/></g>
<g fill="#2a211c"><rect x="-140" y="165" width="30" height="18" rx="5"/><rect x="-95" y="160" width="30" height="18" rx="5"/><rect x="80" y="165" width="30" height="18" rx="5"/><rect x="118" y="160" width="30" height="18" rx="5"/></g>
<path d="M-170,-40 C-170,-95 -120,-105 -40,-100 C40,-105 110,-100 140,-80 C165,-60 165,20 140,50 C110,70 -120,72 -150,50 C-172,30 -172,0 -170,-40Z" fill="#f6f2ea"/>
<g fill="#24201e"><path d="M-120,-95 C-80,-100 -60,-70 -80,-40 C-100,-20 -140,-35 -145,-60 C-148,-80 -135,-92 -120,-95Z"/>
<path d="M10,-98 C50,-100 70,-80 60,-55 C45,-30 0,-40 -5,-65 C-8,-85 -5,-96 10,-98Z"/><path d="M-40,10 C-10,0 20,20 5,45 C-15,62 -55,50 -55,30 C-55,18 -50,12 -40,10Z"/></g>
<ellipse cx="60" cy="62" rx="34" ry="20" fill="#f2a3a8"/>
<path d="M120,-85 C150,-112 192,-112 216,-96 L252,-42 C262,-20 248,2 226,2 C206,2 192,-18 176,-34 C160,-50 140,-40 128,-30Z" fill="#f6f2ea"/>
<path d="M150,-100 C165,-112 190,-108 200,-95 C185,-90 165,-88 150,-100Z" fill="#24201e"/>
<ellipse cx="238" cy="-14" rx="24" ry="17" fill="#f2b3b0"/><circle cx="246" cy="-16" r="3.5" fill="#6b3b3b"/>
<circle cx="204" cy="-70" r="6" fill="#1a1a1a"/>
<ellipse cx="172" cy="-98" rx="22" ry="10" transform="rotate(-25 172 -98)" fill="#efe6da"/>
<path d="M188,-110 C186,-128 196,-136 206,-134 C198,-128 196,-120 196,-108Z" fill="#efe3c4"/>`}
function bact(w,h,fill,stroke){return `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`}
function hexg(r,fill,stroke="#fff"){let p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push((r*Math.cos(a)).toFixed(1)+","+(r*Math.sin(a)).toFixed(1))}
  return `<polygon points="${p.join(" ")}" fill="${fill}" stroke="${stroke}" stroke-opacity=".5" stroke-width="2"/>`}
function virus(r,fill){let s="";for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${r*Math.cos(a)}" y1="${r*Math.sin(a)}" x2="${(r+14)*Math.cos(a)}" y2="${(r+14)*Math.sin(a)}" stroke="${fill}" stroke-width="4"/><circle cx="${(r+16)*Math.cos(a)}" cy="${(r+16)*Math.sin(a)}" r="5" fill="${fill}"/>`}
  return s+`<circle r="${r}" fill="${fill}" fill-opacity=".85"/>`}
function palm(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})" fill="#04121c"><path d="M0,0 C6,-120 18,-240 30,-330 L40,-330 C28,-240 16,-120 12,0Z"/>
<path d="M35,-330 C-20,-360 -90,-340 -120,-300 C-70,-330 -20,-330 35,-322Z"/><path d="M35,-330 C90,-370 160,-350 190,-300 C140,-335 90,-335 35,-322Z"/>
<path d="M35,-332 C10,-400 -40,-420 -70,-410 C-30,-395 0,-370 30,-325Z"/><path d="M35,-332 C70,-400 120,-420 150,-405 C110,-395 75,-370 40,-325Z"/>
<path d="M35,-330 C0,-330 -50,-290 -60,-240 C-30,-280 0,-305 35,-322Z"/><path d="M35,-330 C80,-320 120,-280 125,-235 C100,-275 70,-305 35,-322Z"/></g>`}
function shed(x,y,w,h){return `<g transform="translate(${x},${y})"><path d="M0,${h} L0,${h*.35} L${w/2},0 L${w},${h*.35} L${w},${h}Z" fill="#061826"/>
<path d="M-12,${h*.38} L${w/2},-8 L${w+12},${h*.38}" stroke="#0e3550" stroke-width="10" fill="none"/>
<rect x="${w*.08}" y="${h*.5}" width="${w*.84}" height="${h*.28}" fill="#f2b84a" opacity=".18"/></g>`}

/* ============ timeline ============ */
const SC=[]; // {id,d,build,upd,subs:[[s,e,text]]}
// Scene lengths and subtitles come from the voice-over (vo_timing.js, made by voice.py); animations stretch to fit.
function S(id,d,build,upd,subs=[]){const v=window.VOT&&VOT[id];const D=v?v.d:d;const k=D/d;SC.push({id,d:D,build,upd:(u,r,dd)=>upd(u/k,r,dd/k),subs:v?v.subs:subs})}

/* --- A intro --- */
S("A",3.5,()=>`
 <div class="abs" style="left:0;right:0;top:700px;text-align:center" id="a1"><div style="display:inline-block;width:260px;height:260px;border-radius:64px;background:#fff;padding:28px;box-shadow:0 0 120px rgba(79,216,255,.35)"><img src="logo.png" style="width:100%;height:100%"></div></div>
 <div class="abs big" style="left:0;right:0;top:1030px;text-align:center;font-size:66px;letter-spacing:.14em" id="a2">ONENESS GLOBE</div>
 <div class="abs" style="left:0;right:0;top:1120px;text-align:center;font-family:Inter;font-size:30px;letter-spacing:.3em;color:var(--gold)" id="a3">EMPOWERED BY UNITY</div>
 <div class="abs" style="left:0;right:0;top:1240px;text-align:center;font-size:36px;opacity:.85" id="a4">উপস্থাপন করছে</div>`,
(u,r)=>{popin(q(r,"#a1"),u,.1,.9);show(q(r,"#a2"),u,.6);show(q(r,"#a3"),u,.9);show(q(r,"#a4"),u,1.3)});

/* --- B poultry problems --- */
S("B",6,()=>{let birds="";const rr=rng(3);
  for(let row=0;row<5;row++){const sc=.22+row*.11,y=720+row*70;for(let i=0;i<9-row;i++){const x=80+i*(1000/(9-row))+rr()*40;birds+=`<g class="bb" data-p="${rr()*6}" transform="translate(${x},${y}) scale(${sc})" opacity="${.35+row*.1}">${chicken("#d8cbb6","#c6b79c","#b7a586")}</g>`}}
  return `<svg class="full" viewBox="0 0 1080 1920">
  <defs><linearGradient id="bfl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a17"/><stop offset="1" stop-color="#140d07"/></linearGradient>
  <radialGradient id="heat" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ff7a2a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient></defs>
  <rect x="0" y="640" width="1080" height="760" fill="url(#bfl)"/>
  <path d="M0,640 L1080,640 L1080,420 L540,300 L0,420Z" fill="#0b2232"/>
  ${[0,1,2,3,4,5,6].map(i=>`<line x1="${i*180}" y1="${420-(i<=3?i:6-i)*40}" x2="540" y2="560" stroke="#163a52" stroke-width="4"/>`).join("")}
  ${[180,540,900].map(x=>`<g><line x1="${x}" y1="${x==540?310:380}" x2="${x}" y2="520" stroke="#2a4a5c" stroke-width="3"/><path d="M${x-26},520 L${x+26},520 L${x+12},545 L${x-12},545Z" fill="#c9d6dd"/><circle cx="${x}" cy="552" r="9" fill="#ffd37a" class="lamp"/></g>`).join("")}
  <rect x="0" y="440" width="70" height="200" fill="#1f4a3a" opacity=".8"/><rect x="1010" y="440" width="70" height="200" fill="#1f4a3a" opacity=".8"/>
  ${birds}
  <rect class="heat" x="0" y="300" width="1080" height="1100" fill="url(#heat)"/>
  <g id="bigc" transform="translate(560,1180) scale(2.2)">${chicken()}</g>
  <g id="thermo" transform="translate(905,880)"><rect x="-18" y="-120" width="36" height="200" rx="18" fill="#0d2433" stroke="#fff" stroke-opacity=".7" stroke-width="4"/>
   <circle cx="0" cy="95" r="34" fill="#ff5a3c"/><rect id="tbar" x="-9" y="0" width="18" height="90" rx="9" fill="#ff5a3c"/></g>
  </svg>
  <div class="ttl" id="bt"><div class="bn">পোল্ট্রিতে উৎপাদনের চ্যালেঞ্জ</div><div class="en">Poultry health challenges</div></div>
  ${[["তাপজনিত ধকল","Heat stress","#ff8a5c"],["খাদ্য গ্রহণ কমে যাওয়া","Reduced feed intake","#ffc23d"],["বৃদ্ধি ও ডিম উৎপাদন হ্রাস","Lower growth & egg output","#ff5a6e"]]
   .map((c,i)=>`<div class="chip2 bc" style="left:${[60,560,250][i]}px;top:${[460,460,1440][i]}px;background:rgba(10,20,30,.85);border:2px solid ${c[2]}">${c[0]}<small>${c[1]}</small></div>`).join("")}`},
(u,r)=>{show(q(r,"#bt"),u,.1);
  qa(r,".bb").forEach(b=>{const p=+b.dataset.p;const tr=b.getAttribute("transform").replace(/ rotate\(.*\)/,"");b.setAttribute("transform",tr+` rotate(${Math.sin(u*1.3+p)*2})`)});
  q(r,"#bigc").setAttribute("transform",`translate(560,${1180+Math.sin(u*2)*4}) scale(2.2) rotate(${4+Math.sin(u*1.1)*1.5})`);
  q(r,"#bigc .head").setAttribute("transform",`translate(0,${10+eo(R(u,1,2))*14}) rotate(${eo(R(u,1,2))*12} 60 -60)`);
  q(r,"#tbar").setAttribute("y",90-eo(R(u,.5,3))*170);q(r,"#tbar").setAttribute("height",eo(R(u,.5,3))*170);
  q(r,".heat").setAttribute("opacity",.4+.3*Math.sin(u*3));
  qa(r,".bc").forEach((c,i)=>popin(c,u,1+i*.7));},
 [[.3,5.8,"আপনার খামারের প্রাণী কি বারবার অসুস্থ হয়ে পড়ছে?"]]);

/* --- C cattle problems --- */
S("C",6,()=>`<svg class="full" viewBox="0 0 1080 1920">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3b55"/><stop offset=".6" stop-color="#d98a4a"/><stop offset="1" stop-color="#f2c27a"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5a2a"/><stop offset="1" stop-color="#0f2410"/></linearGradient></defs>
  <rect x="0" y="380" width="1080" height="700" fill="url(#sky)" opacity=".85"/>
  <circle cx="300" cy="900" r="70" fill="#ffd9a0" opacity=".9"/>
  ${shed(560,780,420,220)}${shed(80,820,300,180)}
  ${palm(40,1000,.9)}${palm(980,1000,1.05)}${palm(820,1010,.7)}
  <rect x="0" y="1000" width="1080" height="420" fill="url(#grass)"/>
  <g id="cw" transform="translate(520,1150) scale(1.45)">${cow()}</g></svg>
  <div class="ttl" id="ct"><div class="bn">গবাদিপশুর উৎপাদন ও স্বাস্থ্য সমস্যা</div><div class="en">Cattle health &amp; production challenges</div></div>
  ${[["দুধ উৎপাদন কমে যাওয়া","Reduced milk yield"],["বিপাকীয় ধকল","Metabolic stress: ketosis, fatty liver"],["ম্যাস্টাইটিস ও ধকল","Mastitis & stress"],["প্রজনন সমস্যা","Reproductive issues"]]
   .map((c,i)=>`<div class="chip2 cc" style="left:${[60,520,60,560][i]}px;top:${[470,470,1450,1450][i]}px;background:rgba(10,20,30,.85);border:2px solid var(--red)">${c[0]}<small>${c[1]}</small></div>`).join("")}`,
(u,r)=>{show(q(r,"#ct"),u,.1);q(r,"#cw").setAttribute("transform",`translate(${520-u*6},1150) scale(1.45)`);qa(r,".cc").forEach((c,i)=>popin(c,u,.8+i*.6))},
 [[.2,5.8,"কমে যাচ্ছে খাদ্য গ্রহণ, বৃদ্ধি কিংবা উৎপাদনশীলতা?"]]);

/* --- D gut barrier & dysbiosis --- */
S("D",10,()=>{const rr=rng(7);let cells="",tj="",mv="",lum="";
  for(let i=0;i<9;i++){const x=40+i*111.1;cells+=`<g class="cell" data-i="${i}"><rect x="${x+4}" y="780" width="103" height="230" rx="22" fill="#e597ad" stroke="#ffd1dc" stroke-width="2"/><ellipse cx="${x+55}" cy="930" rx="24" ry="30" fill="#7c3a78"/></g>`;

const XF=.5; let T=0;
SC.forEach(s=>{s.s=T;s.e=T+s.d;T+=s.d});
window.DURATION=T;
window.SUBS=[];SC.forEach(s=>s.subs.forEach(([a,b,tx])=>SUBS.push([s.s+a,s.s+b,tx,s.id])));
window.SCENES=SC.map(s=>({id:s.id,start:+s.s.toFixed(2),end:+s.e.toFixed(2)}));
const host=document.getElementById("scenes");
SC.forEach(s=>{const d=document.createElement("div");d.className="scene";d.id="S"+s.id;d.innerHTML=s.build();host.appendChild(d);s.el=d});
const parts=document.getElementById("parts");const pr=rng(99);const PT=[];
for(let i=0;i<46;i++){const e=document.createElement("i");const sz=4+pr()*10;e.style.width=e.style.height=sz+"px";parts.appendChild(e);PT.push({e,x:pr()*1080,y:pr()*1920,v:10+pr()*30,p:pr()*6,o:.2+pr()*.5})}
const subEl=document.getElementById("subt");let lastSub="";

window.render=function(t){
  SC.forEach((s,i)=>{const a=i==0?-1:s.s-XF/2,b=i==SC.length-1?T+1:s.e+XF/2;
    if(t<a||t>b){s.el.style.display="none";return}
    s.el.style.display="block";const o=cl(Math.min((t-a)/XF,(b-t)/XF));const u=t-s.s;
    s.el.style.opacity=o;const z=1+(1-o)*(t<s.s+1?.04:-.03);s.el.style.transform=`scale(${z})`;
    s.upd(u,s.el,s.d)});
  PT.forEach(p=>{const y=((p.y-t*p.v)%1920+1920)%1920;p.e.style.transform=`translate(${p.x+Math.sin(t*.5+p.p)*20}px,${y}px)`;p.e.style.opacity=p.o*(.6+.4*Math.sin(t+p.p))});
  document.getElementById("bg").style.backgroundPosition=`${Math.sin(t*.1)*40}px ${Math.cos(t*.08)*40}px`;
  const wm=document.getElementById("wm");const sB=SC.find(s=>s.id=="B").s,sR=SC.find(s=>s.id=="R").s;
  wm.style.opacity=cl(Math.min((t-sB)/.6,(sR-t)/.6));
  const cur=SUBS.find(x=>t>=x[0]&&t<x[1]&&x[3]!=="R");
  if(cur){if(lastSub!==cur[2]){subEl.textContent=cur[2];lastSub=cur[2]}subEl.style.opacity=cl(Math.min((t-cur[0])/.25,(cur[1]-t)/.25));subEl.style.transform=`translateY(${(1-cl((t-cur[0])/.3))*12}px)`}
  else subEl.style.opacity=0;
  document.getElementById("prog").style.width=(t/T*100)+"%";
};
